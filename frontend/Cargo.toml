[package]
name = "audio2text-ui"
version = "2.0.5"
edition = "2024"
publish = false

[[bin]]
name = "Audio2Text"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
